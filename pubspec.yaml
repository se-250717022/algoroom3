version: 0.1.0+1
environment:
  sdk: ^3.14.0
  flutter: ">=3.50.1"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  cupertino_ui: ^1.1.7
  material_ui: ^1.11.1
